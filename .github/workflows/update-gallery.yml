name: Update Galleries

on:
  push:
    paths:
      - 'jpg/**'
  workflow_dispatch:

jobs:
  update-galleries:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate gallery.js files
        run: |
          # 1. Ensure the target directory exists
          TARGET_DIR="js/football"
          mkdir -p "$TARGET_DIR"

          declare -a folders=("champions" "europa" "conference" "super")

          for folder in "${folders[@]}"; do
            # 2. Check the source folder (case-sensitive!)
            if [ -d "jpg/$folder" ]; then
              output="$TARGET_DIR/gallery-${folder}.js"

              echo "const images = [" > "$output"

              # 3. Find images in jpg/ and write paths to the .js file
              # Note: This keeps paths as "jpg/folder/image.jpg"
              find "jpg/$folder" -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.gif" -o -iname "*.webp" \) \
              | sort -r \
              | sed 's/^/  \"/; s/$/\",/' >> "$output"

              echo "];" >> "$output"
              echo "✅ Created $output"
            fi
          done

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 4. Stage specifically the new files
          git add js/football/*.js

          git diff-index --quiet HEAD || git commit -m "Auto-update gallery JS files"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:main
