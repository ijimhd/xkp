steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Gallery JS files (Subfolders Only)
        run: |
          # Find all directories inside jpg/ EXCEPT for the jpg folder itself
          find jpg -mindepth 1 -type d | while read -r dir; do
            
            # Count images in this specific subfolder
            img_count=$(find "$dir" -maxdepth 1 -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.webp" \) | wc -l)
            
            # Only create a JS file if there are images AND it's a subfolder
            if [ "$img_count" -gt 0 ]; then
              # Define target directory (e.g., js/football/champions)
              # This removes the 'jpg/' prefix from the path
              subpath="${dir#jpg/}"
              target_js_dir="js/$subpath"
              mkdir -p "$target_js_dir"
              
              output="$target_js_dir/gallery.js"
              
              echo "const images = [" > "$output"
              
              # List images in this folder
              find "$dir" -maxdepth 1 -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.webp" \) \
              | sort -r \
              | sed 's/^/  \"/; s/$/\",/' >> "$output"
              
              echo "];" >> "$output"
              echo "✅ Processed subfolder: $dir (Created $output)"
            fi
          done

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add only the js directory
          git add js/
          
          git diff-index --quiet HEAD || git commit -m "Auto-update gallery JS files (subfolders only)"
          git push origin HEAD:${{ github.ref }}