name: Update Galleries

on:
  push:
    paths:
      - 'jpg/**'
  workflow_dispatch:

jobs:
  update-galleries:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate gallery.js files in js/football
        run: |
          # The directory where the .js files will live
          TARGET_DIR="js/football"
          mkdir -p "$TARGET_DIR"

          declare -a folders=("champions" "europa" "conference" "super")

          for folder in "${folders[@]}"; do
            if [ -d "jpg/$folder" ]; then
              # The .js file is created in js/football/
              output="$TARGET_DIR/gallery-${folder}.js"

              echo "const images = [" > "$output"
              # The find command still looks in jpg/ and keeps those paths
              find "jpg/$folder" -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.gif" -o -iname "*.webp" \) \
              | sort -r \
              | sed 's/^/  \"/; s/$/\",/' >> "$output"
              echo "];" >> "$output"

              echo "✅ Created $output (pointing to jpg/$folder)"
            fi
          done

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add the new .js files
          git add js/football/gallery-*.js

          git diff-index --quiet HEAD || git commit -m "Update football gallery files in js/football"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:main
