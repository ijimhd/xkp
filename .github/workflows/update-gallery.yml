name: Update Galleries

on:
  push:
    paths:
      - 'jpg/**'
  workflow_dispatch:

jobs:
  update-galleries:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Gallery JS files
        run: |
          # Find directories inside jpg, excluding jpg itself
          find jpg -mindepth 1 -type d | while read -r dir; do
            
            # Count images
            img_count=$(find "$dir" -maxdepth 1 -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.webp" \) | wc -l)
            
            if [ "$img_count" -gt 0 ]; then
              # Define target (e.g., js/football/champions)
              subpath="${dir#jpg/}"
              target_js_dir="js/$subpath"
              mkdir -p "$target_js_dir"
              
              output="$target_js_dir/gallery.js"
              
              echo "const images = [" > "$output"
              
              # List images and format for JS array
              find "$dir" -maxdepth 1 -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.webp" \) \
              | sort -r \
              | sed 's|^|  "|; s|$|",|' >> "$output"
              
              echo "];" >> "$output"
              echo "✅ Created $output"
            fi
          done

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/
          # Only commit if there are actually changes to avoid errors
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update gallery JS files"
            git push
          else
            echo "No changes to commit"
          fi
