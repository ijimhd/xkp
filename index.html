<!DOCTYPE html>
<html lang="el">
    <head>
        <meta charset="utf-8">
        <meta name="description" content="xkpfoto">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Xkpfoto</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="preload"
              href="/fonts/PlayfairDisplay-ExtraBold.woff2"
              as="font"
              type="font/woff2"
              crossorigin>

        <link rel="preload"
              href="/fonts/SourceSans3-Regular.woff2"
              as="font"
              type="font/woff2"
              crossorigin>
        <link rel="icon" type="image/svg+xml" href="/jpg/favicon.svg" />
        <script defer src="/js/dropdown.js"></script>
    </head>
    <body>
        <div class="background">
            <div class="header-container">
                <a class="header-logo-link" href="./index.html">
                    <img class="header-logo" src="./jpg/header-logo.png" alt="Xkpfoto logo">
                </a>
                <input type="checkbox" id="sidebar-active">
                <label for="sidebar-active" class="open-sidebar-button">
                    <svg xmlns="http://www.w3.org/2000/svg" height="40" viewBox="0 -960 960 960" width="40"><path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"/></svg>
                </label>
                <label id="overlay" for="sidebar-active"></label>
                <div class="links-container">
                    <label for="sidebar-active" class="close-sidebar-button">
                        <svg xmlns="http://www.w3.org/2000/svg" height="40" viewBox="0 -960 960 960" width="40"><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></svg>
                    </label>          
                    <a class="nav-link nav-item" href="./index.html">HOME</a>      
                    <a class="nav-link nav-item" href="./pages/football.html">FOOTBALL</a>
                    <a class="nav-link nav-item" href="./pages/basketball.html">BASKETBALL</a>
                    <div class="dropdown-container" id="servicesDropdown">
                        <a href="#" class="nav-link">CONTACT ▾</a>
                        <div class="dropdown-menu">
                            <div class="dropdown-content">
                                <a href="mailto:harys.karanikolos@gmail.com">Email</a>
                                <a href="https://www.instagram.com/xkpfoto/" target="_blank" rel="noopener noreferrer">Instagram</a>
                            </div> 
                        </div>
                    </div>
                </div>
            </div>
            <div class="hero-text">
                <p class="hero-title">SPORTS</p>
                <p class="hero-title">PORTFOLIO</p>
            </div>
        </div>
        <div class="sports-categories content">
            <div class="football-container container">
                <a href="./pages/football.html">
                    <picture>
                        <!-- Image for mobile -->
                        <source srcset="/jpg/champions-mobile-menu.webp" media="(max-width: 900px)" class="image">
                        <!-- Image for desktop -->
                        <source srcset="/jpg/champions-desktop.webp" media="(min-width: 899px)" class="image">
                        <!-- Fallback (for browsers that don’t support <picture>) -->
                        <img src="/jpg/champions-mobile-menu.webp" alt="Responsive image" class="image">
                    </picture>
                    <div class="overlay">
                        <div class="football-text">Football</div>
                    </div>
                </a>
            </div>

            <div class="basketball-container container">
                <a href="./pages/basketball.html">
                    <picture>
                        <!-- Image for mobile -->
                        <source srcset="/jpg/champions-mobile-menu.webp" media="(max-width: 900px)" class="image">
                        <!-- Image for desktop -->
                        <source srcset="/jpg/champions-desktop.webp" media="(min-width: 899px)" class="image">
                        <!-- Fallback (for browsers that don’t support <picture>) -->
                        <img src="/jpg/champions-mobile-menu.webp" alt="Responsive image" class="image">
                    </picture>
                    <div class="overlay">
                        <div class="football-text">Basketball</div>
                    </div>
                </a>
            </div>
        </div>
    </body>
</html>
