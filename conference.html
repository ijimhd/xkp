        <script src="gallery-conference.js"></script>
        <script>
            document.addEventListener("DOMContentLoaded", () => {
            const gallery = document.getElementById("gallery");
    
            // Fisher–Yates shuffle (fast, unbiased)
            function shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
            }
    
            // Shuffle first, then create image elements
            const shuffled = shuffleArray([...images]); // copy to avoid modifying the original
            const fragment = document.createDocumentFragment(); // improves performance
    
            shuffled.forEach(name => {
                const img = document.createElement("img");
                img.src = name;
                img.loading = "lazy"; // improves page load time
                img.className = "w-full h-auto rounded-lg shadow-md object-cover";

                img.onload = () => img.classList.add("loaded");
                fragment.appendChild(img);
            });
    
            // Append all at once (after shuffle)
            gallery.appendChild(fragment);
            });
        </script>
    </body>
